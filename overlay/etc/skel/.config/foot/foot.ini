# foot — перенесено из Alacritty. Документация: man foot.ini
[main]
shell=/bin/sh -c "command -v zsh >/dev/null && exec zsh || exec bash"
font=monospace:size=11
pad=10x8
include=~/.config/foot/themes/noctalia.ini

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[text-bindings]
# Shift+Enter → новая строка (как было в Alacritty, нужно для Claude Code)
\x1b\x0d=Shift+Return

[colors-dark]
# полупрозрачность + размытие фона (niri поддерживает ext-background-effect)
alpha=0.78
blur=yes
