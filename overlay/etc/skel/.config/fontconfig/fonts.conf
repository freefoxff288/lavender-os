<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Inter — интерфейс, Fira Code — код и терминал; значки Nerd Font и эмодзи — запасные -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Fira Code</family><family>Noto Sans Mono</family><family>Symbols Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
